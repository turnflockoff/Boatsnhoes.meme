[build]
  publish = "."

# Static site: no build command. Security headers live in /_headers.

# Keep internal project folders off the public website (they stay on GitHub).
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/prototype/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/prompts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.github/*"
  to = "/404.html"
  status = 404
  force = true
