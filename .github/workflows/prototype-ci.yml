name: prototype-ci

on:
  push:
    paths:
      - "prototype/**"
      - "reports/**"
      - "**.html"
      - "_headers"
      - "netlify.toml"
      - "assets/**"
      - ".github/workflows/prototype-ci.yml"
  pull_request:
    paths:
      - "prototype/**"
      - "reports/**"
      - "**.html"
      - "_headers"
      - "netlify.toml"
      - "assets/**"
      - ".github/workflows/prototype-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: prototype/requirements.lock
      - name: Install dependencies (exact versions, sha256-checked)
        run: pip install --require-hashes -r requirements.lock
      - name: Check the lock, requirements.txt and reviewed licenses agree
        run: python -m app.deps_check lock
      - name: Check installed packages match the lock and their declared licenses
        run: python -m app.deps_check installed
      - name: Run tests
        run: pytest -q
      - name: Re-check published reports (reports/)
        run: python -m app.publish_report check
      - name: Check site pages, links and headers (static, reads files only)
        run: python -m app.site_check static
