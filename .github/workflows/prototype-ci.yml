name: prototype-ci

on:
  push:
    paths:
      - "prototype/**"
      - "reports/**"
      - "**.html"
      - "_headers"
      - "netlify.toml"
      - "assets/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "prototype/**"
      - "reports/**"
      - "**.html"
      - "_headers"
      - "netlify.toml"
      - "assets/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, as of 2026-11-23
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, as of 2026-11-23
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: prototype/requirements.lock
      - name: Install dependencies (exact versions, sha256-checked)
        run: pip install --require-hashes -r requirements.lock
      - name: Check the lock, requirements.txt and reviewed licenses agree
        run: python -m app.deps_check lock
      - name: Check installed packages match the lock and their declared licenses
        run: python -m app.deps_check installed
      - name: Check workflow actions are pinned to commits, tokens read-only
        run: python -m app.workflow_check
      - name: Run tests
        run: pytest -q
      - name: Re-check published reports (reports/)
        run: python -m app.publish_report check
      - name: Check site pages, links and headers (static, reads files only)
        run: python -m app.site_check static
      - name: Check site pages for accessibility problems (reads files only)
        run: python -m app.a11y_check
      - name: Check Meme Lab gallery pictures carry no hidden data (location, camera, notes)
        run: python -m app.meme_gallery check
