name: prototype-ci

on:
  push:
    paths:
      - "prototype/**"
      - ".github/workflows/prototype-ci.yml"
  pull_request:
    paths:
      - "prototype/**"
      - ".github/workflows/prototype-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: prototype/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
